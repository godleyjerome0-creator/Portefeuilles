<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f4f6fa;--cd:#fff;--tx:#0f1b33;--mu:#64748b;--pr:#2563eb;--in:#16a34a;--out:#dc2626;--bd:#e2e8f0;--sh:0 1px 2px rgba(15,27,51,.06);--gl:rgba(255,255,255,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a101c;--cd:#111a2c;--tx:#e9eef8;--mu:#8895ad;--pr:#3b82f6;--in:#22c55e;--out:#ef4444;--bd:#1e2a41;--sh:0 1px 2px rgba(0,0,0,.4);--gl:rgba(17,26,44,.72)}}
:root[data-theme="dark"]{--bg:#0a101c;--cd:#111a2c;--tx:#e9eef8;--mu:#8895ad;--pr:#3b82f6;--in:#22c55e;--out:#ef4444;--bd:#1e2a41;--sh:0 1px 2px rgba(0,0,0,.4);--gl:rgba(17,26,44,.72)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -5%,rgba(59,156,255,.16),transparent 45%),radial-gradient(circle at 0% 25%,rgba(124,92,255,.14),transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 100px}
h1{font-size:26px;margin:8px 0 12px;letter-spacing:-.5px}
h2{font-size:15px;color:var(--mu);margin:18px 0 8px;font-weight:600}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#0ea5e9,#6366f1 60%,#8b5cf6);color:#fff;border:0;box-shadow:0 0 28px rgba(99,102,241,.5)}.hero .mu{color:rgba(255,255,255,.8)}.hero .in,.hero .big.out{color:#a7f3c9}.hero .out{color:#ffd0d0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}.ic.in{background:rgba(16,165,90,.14)}.ic.out{background:rgba(229,72,77,.14)}
.g,.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big{font-size:24px;font-weight:700}.big,b.in,b.out{font-family:ui-monospace,"SF Mono",Menlo,monospace}.mu{color:var(--mu);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);margin:4px 0 10px}
.b{background:linear-gradient(135deg,var(--pr),#6366f1);color:#fff;border:0;border-radius:14px;padding:14px;width:100%;font-weight:600;margin-bottom:8px;box-shadow:0 0 16px rgba(99,102,241,.4)}
.b.in{background:var(--in);color:#04131f}.b.out{background:var(--out);color:#fff}
.b.s{background:var(--cd);color:var(--pr);border:1px solid var(--bd);box-shadow:none}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(30,60,120,.12);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 0}
nav button.a{color:var(--pr);text-shadow:0 0 12px var(--pr)}nav b{display:block;font-size:20px;font-weight:400}
nav .p b{background:linear-gradient(135deg,var(--pr),#6366f1);box-shadow:0 0 18px rgba(99,102,241,.6);color:#fff;border-radius:50%;width:44px;height:44px;line-height:44px;margin:-18px auto 0;font-size:28px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:100;font-size:14px}
#auth{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:98;overflow:auto;padding:20px}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:99}
body{background:var(--bg) !important}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--mu);margin:24px 4px 8px}
.c{border-radius:14px;padding:16px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);box-shadow:none;border:0}
.big,b.in,b.out{font-family:inherit;font-variant-numeric:tabular-nums}
.b{background:var(--pr);box-shadow:none;border-radius:12px;padding:14px;letter-spacing:.2px}
.b.in{background:#16a34a;color:#fff}.b.out{background:#dc2626;color:#fff}
.b.s{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{border-radius:12px}
.ic{border-radius:10px}
.tg{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu);margin-left:6px;font-weight:600}
nav{border-radius:0;box-shadow:none;background:var(--cd)}
nav button.a{color:var(--pr);text-shadow:none}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
nav .p b{background:var(--pr);box-shadow:none;padding:0}
nav .p b svg{stroke:#fff;width:24px;height:24px;margin:10px}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes dr{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.15)}}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
body,input,select,button,textarea{font-family:Inter,-apple-system,system-ui,sans-serif}
h1,.big{font-family:"Space Grotesk",Inter,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 95% -5%,rgba(56,189,248,.2),transparent 60%),radial-gradient(520px 420px at -10% 35%,rgba(139,92,246,.2),transparent 60%),var(--bg)}
.c{background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(148,163,184,.16);animation:fu .5s both}
.hero{background:linear-gradient(135deg,#0ea5e9 0%,#2563eb 48%,#7c3aed 100%);position:relative;overflow:hidden;border:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);background-size:200% 100%;animation:sh 7s linear infinite;pointer-events:none}
.hero>*{position:relative;z-index:1}
.b{background:linear-gradient(135deg,#2563eb,#6d4aff);box-shadow:0 6px 20px rgba(79,70,229,.35);transition:transform .15s}
.b:active{transform:scale(.97)}
.b.s{background:var(--gl);box-shadow:none}
.b.in{background:#16a34a;box-shadow:0 6px 18px rgba(22,163,74,.3)}.b.out{background:#dc2626;box-shadow:0 6px 18px rgba(220,38,38,.3)}
input,select,textarea{background:rgba(127,140,165,.1)}
nav{background:var(--gl);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
nav .p b{background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 6px 18px rgba(99,102,241,.45)}
#auth{align-items:flex-start;padding:0;background:var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:dr 14s ease-in-out infinite;pointer-events:none}
.o1{width:280px;height:280px;background:#2563eb;top:-70px;left:-70px}.o2{width:260px;height:260px;background:#7c3aed;bottom:-50px;right:-70px;animation-delay:-6s}
.gd{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.09) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 50% 28%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 28%,#000,transparent 72%)}
.lw{position:relative;z-index:1;width:min(380px,100%);margin:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 28px;text-align:center}
.fl{animation:fl 5s ease-in-out infinite}
.lt{font-size:32px;margin:6px 0 6px;background:linear-gradient(90deg,var(--tx),var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}
.ls{color:var(--mu);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.chips span{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid rgba(148,163,184,.25);background:var(--gl);color:var(--mu)}
.gc{text-align:left}
.bgi{position:fixed;inset:0;z-index:0;pointer-events:none}.bgi svg{display:block}
.bgi::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,8,22,.1) 20%,rgba(5,8,22,.7) 100%)}
.gd{display:none}.o1,.o2{opacity:.3}
#bg{position:fixed;inset:0;z-index:-1;opacity:.3;pointer-events:none}#bg svg{display:block}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) #bg{display:none}}
:root[data-theme="light"] #bg{display:none}
#auth{background:var(--bg)}
.lw2{width:100%;max-width:480px;margin:0 auto}
.lg-top{position:relative;overflow:hidden;border-radius:0 0 30px 30px;background:linear-gradient(135deg,#0ea5e9,#2563eb 52%,#7c3aed);padding:calc(24px + env(safe-area-inset-top,0px)) 24px 18px;color:#fff;text-align:left}
.lg-top .bgs{position:absolute;inset:0;opacity:.5}.lg-top .bgs svg{display:block}
.lg-top>*:not(.bgs){position:relative}
.bn{display:flex;align-items:center;gap:10px;font:700 26px "Space Grotesk",Inter,sans-serif}
.tg2{opacity:.92;font-size:14px;margin:6px 0 0}
.lg-top svg.fl{display:block;margin:4px auto 0}
.lp{padding:24px 22px 34px;color:var(--tx);text-align:left}
.wb{font:700 26px "Space Grotesk",Inter,sans-serif;margin:0 0 4px;color:var(--tx);text-transform:none;letter-spacing:-.3px}
.fi{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:rgba(127,140,165,.1);border-radius:14px;padding:0 14px;margin:10px 0}
.fi input{border:0;background:transparent;margin:0;padding:15px 0;color:var(--tx);outline:0;border-radius:0}
.fi svg{width:20px;height:20px;stroke:#94a3b8;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eye{display:flex;cursor:pointer}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);margin:6px 0 16px}
.rw label{display:flex;align-items:center;gap:8px}.rw input{width:18px;height:18px;margin:0;accent-color:#2563eb}
.rw a,.su a{color:var(--pr);font-weight:600;text-decoration:none}
.lb{border-radius:99px;padding:16px;font-size:16px}
.or{text-align:center;color:var(--mu);font-size:13px;margin:16px 0 12px}
.gb{background:var(--gl) !important;color:var(--tx) !important;border:1px solid var(--bd) !important;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:99px;box-shadow:none}
.su{text-align:center;margin-top:18px;color:var(--mu);font-size:14px}
</style></head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="lock"></div><div id="auth"></div><div id="bg"></div><div id="toast"></div>
<script>
let K='mp_v1';
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),CUR=['HTG','USD'];
const td=(d=new Date())=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let S={tx:[],cin:['Père','Mère','Famille','Travail','Client','Autre'],cout:['Nourriture','Transport','Internet','Téléphone','École','Loyer','Santé','Autre'],bud:[],goal:null,rate:0,pin:'',theme:'auto',lb:0};
const S0=JSON.stringify(S),DEF=()=>JSON.parse(S0);
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let U=null,FS=null,CS='off',ct;
const cst=()=>U?(CS=='err'?'Synchronisation impossible pour le moment (données gardées sur le téléphone)':''+(U.email||'Compte connecté')+' · synchronisé'):'Données gardées sur ton téléphone · fais une sauvegarde de temps en temps (Paramètres)';
const upd=()=>{const e=$('#cs');if(e)e.textContent=cst()};
const snap=()=>({json:JSON.stringify({...S,pin:''}),t:S.ut||0});
function push(){if(!U)return;clearTimeout(ct);ct=setTimeout(async()=>{try{await FS.doc('users/'+U.uid).set(snap());CS='ok'}catch(e){CS='err'}upd()},1000)}
const save=nc=>{if(!nc)S.ut=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!nc)push()};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const F=(n,c)=>(+n).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+c;
const D=d=>d.split('-').reverse().join('/');
const hs=p=>btoa('mp'+p);
const O=(a,v)=>a.map(([k,t])=>`<option value="${E(k)}" ${k==v?'selected':''}>${E(t)}</option>`).join('');
const L=a=>a.map(c=>[c,c]);
const srt=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
let dt=null,tab='home',fl={p:'month',t:'',c:'',cur:'',q:''},fm={type:'out'},sp='month';
function inP(d,p){if(p=='all')return 1;const t=td();if(p=='day')return d==t;if(p=='month')return d.slice(0,7)==t.slice(0,7);const x=new Date();x.setDate(x.getDate()-6);return d>=td(x)&&d<=t}
const sum=(l,ty,c)=>l.filter(t=>t.type==ty&&t.cur==c&&!t.vd).reduce((a,t)=>a+t.amt,0);
const bal=c=>sum(S.tx,'in',c)-sum(S.tx,'out',c);
function applyTheme(){try{localStorage.setItem('mp_theme',S.theme)}catch(e){}const r=document.documentElement;S.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)}
function go(t){tab=t;R();scrollTo(0,0)}
function qa(t){fm={type:t};go('add')}
function ed(id){dt=id;go('det')}
const row=t=>`<div class="r" onclick="ed(${t.id})" style="${t.vd?'opacity:.55':''}"><span class="ic ${t.type}">${t.type=='in'?'↓':'↑'}</span><div style="flex:1"><b>${E(t.cat)}</b>${t.vd?'<span class="tg">Annulée</span>':''}<div class="mu">${D(t.date)}${t.note?' · '+E(t.note):''}</div></div><b class="${t.type}" style="${t.vd?'text-decoration:line-through':''}">${t.type=='in'?'+':'−'}${F(t.amt,t.cur)}</b></div>`;
const pg=(v,mx)=>{const w=Math.min(100,v/mx*100);return `<div class="bar"><i style="width:${w}%;background:${w>=100?'var(--out)':w>=80?'#f0a020':'var(--pr)'}"></i></div>`};

function vHome(){
 const m=S.tx.filter(t=>inP(t.date,'month'));
 let h='<h1 style="display:flex;align-items:center;gap:10px">'+LOGO+'Mon Portefeuille</h1><div class="mu" id="cs" style="margin:-6px 0 12px">'+cst()+'</div>';
 if(S.tx.length&&Date.now()-S.lb>12096e5)h+='<div class="c" onclick="go(\'set\')">Pense à faire une sauvegarde (Paramètres).</div>';
 h+='<div class="g">'+CUR.map(c=>`<div class="c hero"><div class="mu">Solde ${c}</div><div class="big ${bal(c)<0?'out':''}">${F(bal(c),c)}</div><div class="mu">Ce mois</div><div class="mu in">+ ${F(sum(m,'in',c),c)}</div><div class="mu out">− ${F(sum(m,'out',c),c)}</div></div>`).join('')+'</div>';
 if(S.rate>0)h+=`<div class="c mu">Total estimé : <b>${F(bal('HTG')+bal('USD')*S.rate,'HTG')}</b> (1 USD = ${S.rate} HTG)</div>`;
 h+='<div class="g"><button class="b in" onclick="qa(\'in\')">+ Revenu</button><button class="b out" onclick="qa(\'out\')">− Dépense</button></div>';
 if(S.goal){const g=S.goal,v=Math.max(0,bal(g.cur));h+=`<h2>Objectif d’épargne</h2><div class="c"><div class="r" style="border:0;padding:0 0 8px"><b>${E(g.name)}</b><span>${F(v,g.cur)} / ${F(g.amt,g.cur)}</span></div>${pg(v,g.amt)}</div>`}
 if(S.bud.length)h+='<h2>Budgets du mois</h2><div class="c">'+S.bud.map(b=>{const v=sum(m.filter(t=>t.cat==b.cat),'out',b.cur);return `<div style="margin:6px 0 12px"><div class="r" style="border:0;padding:0 0 6px"><span>${E(b.cat)}</span><span class="${v>b.amt?'out':'mu'}">${F(v,b.cur)} / ${F(b.amt,b.cur)}</span></div>${pg(v,b.amt)}</div>`}).join('')+'</div>';
 h+=spark()+'<h2>Dernières transactions</h2><div class="c">'+(S.tx.length?srt(S.tx).slice(0,5).map(row).join(''):'<div class="mu">Aucune transaction. Touche + pour commencer.</div>')+'</div>';
 return h}

function vTx(){
 const l=srt(S.tx.filter(t=>inP(t.date,fl.p)&&(!fl.t||t.type==fl.t)&&(!fl.c||t.cat==fl.c)&&(!fl.cur||t.cur==fl.cur)&&(!fl.q||(t.cat+' '+(t.note||'')).toLowerCase().includes(fl.q.toLowerCase()))));
 const cats=[...new Set([...S.cin,...S.cout])];
 let h='<h1>Transactions</h1><div class="c">';
 h+=`<input placeholder="Rechercher…" value="${E(fl.q)}" onchange="fl.q=this.value;R()">`;
 h+=`<select onchange="fl.p=this.value;R()">${O([['day','Aujourd’hui'],['week','7 derniers jours'],['month','Ce mois'],['all','Tout']],fl.p)}</select>`;
 h+=`<div class="sg" style="margin:0"><select onchange="fl.t=this.value;R()">${O([['','Tous types'],['in','Revenus'],['out','Dépenses']],fl.t)}</select><select onchange="fl.cur=this.value;R()">${O([['','Toutes devises'],...L(CUR)],fl.cur)}</select></div>`;
 h+=`<select onchange="fl.c=this.value;R()">${O([['','Toutes catégories'],...L(cats)],fl.c)}</select></div>`;
 h+='<div class="c">'+CUR.map(c=>{const a=sum(l,'in',c),b=sum(l,'out',c);return a||b?`<div class="r"><b>${c}</b><span><span class="in">+${F(a,c)}</span> · <span class="out">−${F(b,c)}</span></span></div>`:''}).join('')+'</div>';
 return h+'<div class="c">'+(l.length?l.map(row).join(''):'<div class="mu">Rien à afficher.</div>')+'</div>'}

function vAdd(){
 const i=fm.type=='in',cs=i?S.cin:S.cout;
 return `<h1>${fm.id?'Modifier':'Ajouter'}</h1>
 <div class="sg"><button class="b ${i?'in':'s'}" onclick="st('in')">Revenu</button><button class="b ${i?'s':'out'}" onclick="st('out')">Dépense</button></div>
 <div class="c"><label class="mu">Montant</label><input id="fa" type="number" inputmode="decimal" value="${fm.amt||''}" placeholder="0">
 <label class="mu">Devise</label><select id="fcur">${O(L(CUR),fm.cur||'HTG')}</select>
 <label class="mu">${i?'Provenance (père, mère, travail…)':'Motif de la dépense'}</label>
 <select id="fc" onchange="$('#fn').style.display=this.value=='__n'?'block':'none'">${O(L(cs),fm.cat)}<option value="__n">+ Nouvelle catégorie…</option></select>
 <input id="fn" style="display:none" placeholder="Nom de la catégorie">
 <label class="mu">Date</label><input id="fd" type="date" value="${fm.date||td()}">
 <label class="mu">Note (pourquoi ?)</label><input id="fnote" value="${E(fm.note||'')}" placeholder="Facultatif"></div>
 <button class="b ${fm.type}" onclick="sv()">Enregistrer</button>
 ${fm.id?`<button class="b s" onclick="dl()" style="color:var(--out)">${fm.cf?'Confirmer la suppression ?':'Supprimer'}</button>`:''}
 <button class="b s" onclick="go('home')">Annuler</button>`}
