<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portefeuille">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mon Portefeuille</title>
<meta name="theme-color" content="#060a14">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#eef3fb;--cd:#fff;--tx:#0f1b33;--mu:#6f7f98;--pr:#2563eb;--in:#10a55a;--out:#e5484d;--bd:#e3e9f3;--sh:0 4px 18px rgba(30,60,120,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a14;--cd:#0d1525;--tx:#e6f0ff;--mu:#7f93b5;--pr:#3b9cff;--in:#2ee6a6;--out:#ff5c7a;--bd:#1a2b48;--sh:0 0 0 1px rgba(59,156,255,.05),0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#060a14;--cd:#0d1525;--tx:#e6f0ff;--mu:#7f93b5;--pr:#3b9cff;--in:#2ee6a6;--out:#ff5c7a;--bd:#1a2b48;--sh:0 0 0 1px rgba(59,156,255,.05),0 10px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 85% -5%,rgba(59,156,255,.16),transparent 45%),radial-gradient(circle at 0% 25%,rgba(124,92,255,.14),transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 100px}
h1{font-size:26px;margin:8px 0 12px;letter-spacing:-.5px}
h2{font-size:15px;color:var(--mu);margin:18px 0 8px;font-weight:600}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#0ea5e9,#6366f1 60%,#8b5cf6);color:#fff;border:0;box-shadow:0 0 28px rgba(99,102,241,.5)}.hero .mu{color:rgba(255,255,255,.8)}.hero .in,.hero .big.out{color:#a7f3c9}.hero .out{color:#ffd0d0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}.ic.in{background:rgba(16,165,90,.14)}.ic.out{background:rgba(229,72,77,.14)}
.g,.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big{font-size:24px;font-weight:700}.big,b.in,b.out{font-family:ui-monospace,"SF Mono",Menlo,monospace}.mu{color:var(--mu);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);margin:4px 0 10px}
.b{background:linear-gradient(135deg,var(--pr),#6366f1);color:#fff;border:0;border-radius:14px;padding:14px;width:100%;font-weight:600;margin-bottom:8px;box-shadow:0 0 16px rgba(99,102,241,.4)}
.b.in{background:var(--in);color:#04131f}.b.out{background:var(--out);color:#fff}
.b.s{background:var(--cd);color:var(--pr);border:1px solid var(--bd);box-shadow:none}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(30,60,120,.12);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 0}
nav button.a{color:var(--pr);text-shadow:0 0 12px var(--pr)}nav b{display:block;font-size:20px;font-weight:400}
nav .p b{background:linear-gradient(135deg,var(--pr),#6366f1);box-shadow:0 0 18px rgba(99,102,241,.6);color:#fff;border-radius:50%;width:44px;height:44px;line-height:44px;margin:-18px auto 0;font-size:28px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:100;font-size:14px}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:99}
</style></head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="lock"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),K='mp_v1',CUR=['HTG','USD'];
const td=(d=new Date())=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let S={tx:[],cin:['Père','Mère','Famille','Travail','Client','Autre'],cout:['Nourriture','Transport','Internet','Téléphone','École','Loyer','Santé','Autre'],bud:[],goal:null,rate:0,pin:'',theme:'auto',lb:0};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let DB=null,CS='off',ct;
const cst=()=>'📱 Données gardées sur ton téléphone · fais une sauvegarde de temps en temps (Paramètres)';
const upd=()=>{const e=$('#cs');if(e)e.textContent=cst()};
function push(){if(!DB)return;clearTimeout(ct);ct=setTimeout(async()=>{try{await DB.set({json:JSON.stringify({...S,pin:''}),t:S.ut});CS='ok'}catch(e){CS='err'}upd()},1200)}
const save=nc=>{if(!nc)S.ut=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!nc)push()};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const F=(n,c)=>(+n).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+c;
const D=d=>d.split('-').reverse().join('/');
const hs=p=>btoa('mp'+p);
const O=(a,v)=>a.map(([k,t])=>`<option value="${E(k)}" ${k==v?'selected':''}>${E(t)}</option>`).join('');
const L=a=>a.map(c=>[c,c]);
const srt=l=>[...l].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
let tab='home',fl={p:'month',t:'',c:'',cur:'',q:''},fm={type:'out'},sp='month';
function inP(d,p){if(p=='all')return 1;const t=td();if(p=='day')return d==t;if(p=='month')return d.slice(0,7)==t.slice(0,7);const x=new Date();x.setDate(x.getDate()-6);return d>=td(x)&&d<=t}
const sum=(l,ty,c)=>l.filter(t=>t.type==ty&&t.cur==c).reduce((a,t)=>a+t.amt,0);
const bal=c=>sum(S.tx,'in',c)-sum(S.tx,'out',c);
function applyTheme(){const r=document.documentElement;S.theme=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)}
function go(t){tab=t;R();scrollTo(0,0)}
function qa(t){fm={type:t};go('add')}
function ed(id){fm={...S.tx.find(t=>t.id==id)};go('add')}
const row=t=>`<div class="r" onclick="ed(${t.id})"><span class="ic ${t.type}">${t.type=='in'?'↓':'↑'}</span><div style="flex:1"><b>${E(t.cat)}</b><div class="mu">${D(t.date)}${t.note?' · '+E(t.note):''}</div></div><b class="${t.type}">${t.type=='in'?'+':'−'}${F(t.amt,t.cur)}</b></div>`;
const pg=(v,mx)=>{const w=Math.min(100,v/mx*100);return `<div class="bar"><i style="width:${w}%;background:${w>=100?'var(--out)':w>=80?'#f0a020':'var(--pr)'}"></i></div>`};

function vHome(){
 const m=S.tx.filter(t=>inP(t.date,'month'));
 let h='<h1>Mon Portefeuille 💰</h1><div class="mu" id="cs" style="margin:-6px 0 12px">'+cst()+'</div>';
 if(S.tx.length&&Date.now()-S.lb>12096e5)h+='<div class="c" onclick="go(\'set\')">💾 Pense à faire une sauvegarde (Paramètres).</div>';
 h+='<div class="g">'+CUR.map(c=>`<div class="c hero"><div class="mu">Solde ${c}</div><div class="big ${bal(c)<0?'out':''}">${F(bal(c),c)}</div><div class="mu">Ce mois</div><div class="mu in">+ ${F(sum(m,'in',c),c)}</div><div class="mu out">− ${F(sum(m,'out',c),c)}</div></div>`).join('')+'</div>';
 if(S.rate>0)h+=`<div class="c mu">Total estimé : <b>${F(bal('HTG')+bal('USD')*S.rate,'HTG')}</b> (1 USD = ${S.rate} HTG)</div>`;
 h+='<div class="g"><button class="b in" onclick="qa(\'in\')">+ Revenu</button><button class="b out" onclick="qa(\'out\')">− Dépense</button></div>';
 if(S.goal){const g=S.goal,v=Math.max(0,bal(g.cur));h+=`<h2>Objectif d’épargne</h2><div class="c"><div class="r" style="border:0;padding:0 0 8px"><b>${E(g.name)}</b><span>${F(v,g.cur)} / ${F(g.amt,g.cur)}</span></div>${pg(v,g.amt)}</div>`}
 if(S.bud.length)h+='<h2>Budgets du mois</h2><div class="c">'+S.bud.map(b=>{const v=sum(m.filter(t=>t.cat==b.cat),'out',b.cur);return `<div style="margin:6px 0 12px"><div class="r" style="border:0;padding:0 0 6px"><span>${E(b.cat)}</span><span class="${v>b.amt?'out':'mu'}">${F(v,b.cur)} / ${F(b.amt,b.cur)}</span></div>${pg(v,b.amt)}</div>`}).join('')+'</div>';
 h+='<h2>Dernières transactions</h2><div class="c">'+(S.tx.length?srt(S.tx).slice(0,5).map(row).join(''):'<div class="mu">Aucune transaction. Touche + pour commencer.</div>')+'</div>';
 return h}

function vTx(){
 const l=srt(S.tx.filter(t=>inP(t.date,fl.p)&&(!fl.t||t.type==fl.t)&&(!fl.c||t.cat==fl.c)&&(!fl.cur||t.cur==fl.cur)&&(!fl.q||(t.cat+' '+(t.note||'')).toLowerCase().includes(fl.q.toLowerCase()))));
 const cats=[...new Set([...S.cin,...S.cout])];
 let h='<h1>Transactions</h1><div class="c">';
 h+=`<input placeholder="Rechercher…" value="${E(fl.q)}" onchange="fl.q=this.value;R()">`;
 h+=`<select onchange="fl.p=this.value;R()">${O([['day','Aujourd’hui'],['week','7 derniers jours'],['month','Ce mois'],['all','Tout']],fl.p)}</select>`;
 h+=`<div class="sg" style="margin:0"><select onchange="fl.t=this.value;R()">${O([['','Tous types'],['in','Revenus'],['out','Dépenses']],fl.t)}</select><select onchange="fl.cur=this.value;R()">${O([['','Toutes devises'],...L(CUR)],fl.cur)}</select></div>`;
 h+=`<select onchange="fl.c=this.value;R()">${O([['','Toutes catégories'],...L(cats)],fl.c)}</select></div>`;
 h+='<div class="c">'+CUR.map(c=>{const a=sum(l,'in',c),b=sum(l,'out',c);return a||b?`<div class="r"><b>${c}</b><span><span class="in">+${F(a,c)}</span> · <span class="out">−${F(b,c)}</span></span></div>`:''}).join('')+'</div>';
 return h+'<div class="c">'+(l.length?l.map(row).join(''):'<div class="mu">Rien à afficher.</div>')+'</div>'}

function vAdd(){
 const i=fm.type=='in',cs=i?S.cin:S.cout;
 return `<h1>${fm.id?'Modifier':'Ajouter'}</h1>
 <div class="sg"><button class="b ${i?'in':'s'}" onclick="st('in')">Revenu</button><button class="b ${i?'s':'out'}" onclick="st('out')">Dépense</button></div>
 <div class="c"><label class="mu">Montant</label><input id="fa" type="number" inputmode="decimal" value="${fm.amt||''}" placeholder="0">
 <label class="mu">Devise</label><select id="fcur">${O(L(CUR),fm.cur||'HTG')}</select>
 <label class="mu">${i?'Provenance (père, mère, travail…)':'Motif de la dépense'}</label>
 <select id="fc" onchange="$('#fn').style.display=this.value=='__n'?'block':'none'">${O(L(cs),fm.cat)}<option value="__n">+ Nouvelle catégorie…</option></select>
 <input id="fn" style="display:none" placeholder="Nom de la catégorie">
 <label class="mu">Date</label><input id="fd" type="date" value="${fm.date||td()}">
 <label class="mu">Note (pourquoi ?)</label><input id="fnote" value="${E(fm.note||'')}" placeholder="Facultatif"></div>
 <button class="b ${fm.type}" onclick="sv()">Enregistrer</button>
 ${fm.id?`<button class="b s" onclick="dl()" style="color:var(--out)">${fm.cf?'Confirmer la suppression ?':'Supprimer'}</button>`:''}
 <button class="b s" onclick="go('home')">Annuler</button>`}
function st(t){fm={...fm,amt:$('#fa').value,cur:$('#fcur').value,date:$('#fd').value,note:$('#fnote').value,type:t,cat:''};R()}
function sv(){
 const a=+$('#fa').value;if(!(a>0))return toast('Entre un montant valide');
 let c=$('#fc').value;
 if(c=='__n'){c=$('#fn').value.trim();if(!c)return toast('Nom de catégorie requis');const l=fm.type=='in'?S.cin:S.cout;if(!l.includes(c))l.push(c)}
 const o={id:fm.id||Date.now(),type:fm.type,amt:a,cur:$('#fcur').value,cat:c,date:$('#fd').value||td(),note:$('#fnote').value.trim()};
 fm.id?S.tx=S.tx.map(t=>t.id==fm.id?o:t):S.tx.push(o);
 save();fm={type:'out'};toast('Enregistré ✔');go('home')}
function dl(){if(!fm.cf){fm.cf=1;return R()}S.tx=S.tx.filter(t=>t.id!=fm.id);save();fm={type:'out'};toast('Supprimé');go('tx')}

function vSt(){
 const l=S.tx.filter(t=>inP(t.date,sp));
 const grp=(ty,c)=>{const m={};l.filter(t=>t.type==ty&&t.cur==c).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const bars=(g,c,col)=>{const mx=g[0][1];return g.map(([k,v])=>`<div style="margin:8px 0"><div class="r" style="border:0;padding:0 0 4px"><span>${E(k)}</span><b>${F(v,c)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:${col}"></i></div></div>`).join('')};
 let h=`<h1>Statistiques</h1><select onchange="sp=this.value;R()">${O([['day','Aujourd’hui'],['week','7 derniers jours'],['month','Ce mois'],['all','Tout']],sp)}</select>`;
 CUR.forEach(c=>{
  const a=sum(l,'in',c),b=sum(l,'out',c),mx=Math.max(a,b,1),go_=grp('out',c),gi=grp('in',c);
  h+=`<div class="c"><b>${c}</b><div class="r"><span>Revenus</span><b class="in">${F(a,c)}</b></div><div class="bar"><i style="width:${a/mx*100}%;background:var(--in)"></i></div><div class="r"><span>Dépenses</span><b class="out">${F(b,c)}</b></div><div class="bar"><i style="width:${b/mx*100}%;background:var(--out)"></i></div><div class="r"><span>Différence</span><b>${F(a-b,c)}</b></div>`;
  if(go_.length)h+='<h2>Dépenses par motif</h2>'+bars(go_,c,'var(--out)');
  if(gi.length)h+='<h2>Revenus par provenance</h2>'+bars(gi,c,'var(--in)');
  h+='</div>'});
 return h}

function vSet(){
 const g=S.goal||{};
 return `<h1>Paramètres</h1><div class="c mu" id="cs">${cst()}</div>
 <div class="c"><b>Apparence</b><select onchange="S.theme=this.value;save();applyTheme()">${O([['auto','Automatique'],['light','Clair'],['dark','Sombre']],S.theme)}</select></div>
 <div class="c"><b>Conversion (facultatif)</b><div class="mu">1 USD = ? HTG (taux que tu choisis)</div><input type="number" inputmode="decimal" value="${S.rate||''}" placeholder="Ex. 130" onchange="S.rate=+this.value;save();toast('Taux enregistré')"></div>
 <div class="c"><b>Ajouter une catégorie</b><select id="nt"><option value="out">Dépense</option><option value="in">Revenu</option></select><input id="nn" placeholder="Nom"><button class="b s" onclick="ac()">Ajouter</button></div>
 <div class="c"><b>Budgets par catégorie</b>
 ${S.bud.map((b,i)=>`<div class="r"><span>${E(b.cat)} · ${F(b.amt,b.cur)}</span><button class="b s" style="width:auto;margin:0;padding:6px 12px" onclick="S.bud.splice(${i},1);save();R()">✕</button></div>`).join('')}
 <select id="bc">${O(L(S.cout))}</select><div class="sg" style="margin:0"><input id="ba" type="number" inputmode="decimal" placeholder="Montant max / mois"><select id="bcur">${O(L(CUR))}</select></div><button class="b s" onclick="ab()">Ajouter le budget</button></div>
 <div class="c"><b>Objectif d’épargne</b><input id="gn" placeholder="Nom (ex. Nouveau téléphone)" value="${E(g.name||'')}"><div class="sg" style="margin:0"><input id="ga" type="number" inputmode="decimal" placeholder="Montant visé" value="${g.amt||''}"><select id="gcur">${O(L(CUR),g.cur)}</select></div><button class="b s" onclick="sgl()">Enregistrer l’objectif</button>${S.goal?'<button class="b s" onclick="S.goal=null;save();R()">Retirer l’objectif</button>':''}<div class="mu">Progression = solde actuel dans cette devise.</div></div>
 <div class="c"><b>Code PIN</b>${S.pin?'<div class="mu">Le PIN est activé.</div><button class="b s" onclick="S.pin=\'\';save();R()">Désactiver le PIN</button>':'<input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="4 à 6 chiffres"><button class="b s" onclick="setPin()">Activer le PIN</button>'}</div>
 <div class="c"><b>Sauvegarde et export</b><div class="mu" style="margin-bottom:8px">Touche un bouton, puis « Copier » et colle dans Notes, WhatsApp ou un e-mail. Pour restaurer : colle la sauvegarde JSON ci-dessous puis « Restaurer ».</div>
 <div class="sg"><button class="b s" onclick="ex('csv')">Export CSV</button><button class="b s" onclick="ex('json')">Sauvegarde JSON</button></div>
 <textarea id="bk" rows="5" placeholder="Le contenu apparaît ici"></textarea>
 <div class="sg"><button class="b" onclick="cp()">Copier</button><button class="b s" onclick="rs()">Restaurer</button></div></div>`}
function ac(){const n=$('#nn').value.trim();if(!n)return;const l=$('#nt').value=='in'?S.cin:S.cout;if(l.includes(n))return toast('Existe déjà');l.push(n);save();toast('Catégorie ajoutée');R()}
function ab(){const a=+$('#ba').value;if(!(a>0))return toast('Entre un montant');S.bud.push({cat:$('#bc').value,cur:$('#bcur').value,amt:a});save();R()}
function sgl(){const a=+$('#ga').value;if(!(a>0))return toast('Entre un montant');S.goal={name:$('#gn').value.trim()||'Épargne',amt:a,cur:$('#gcur').value};save();toast('Objectif enregistré');R()}
function setPin(){const v=$('#pn').value;if(!/^\d{4,6}$/.test(v))return toast('4 à 6 chiffres');S.pin=hs(v);save();toast('PIN activé');R()}
function ex(k){let s;if(k=='csv'){s='Date;Type;Devise;Montant;Catégorie;Note\n'+srt(S.tx).map(t=>[t.date,t.type=='in'?'Revenu':'Dépense',t.cur,t.amt,t.cat,t.note||''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')}else{S.lb=Date.now();save();s=JSON.stringify({...S,pin:''})}$('#bk').value=s;toast('Prêt : touche « Copier »')}
function cp(){const a=$('#bk');if(!a.value)return;a.select();a.setSelectionRange(0,1e7);try{document.execCommand('copy');toast('Copié ✔')}catch(e){toast('Copie le texte à la main')}}
function rs(){try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.tx))throw 0;S=Object.assign(S,j,{pin:S.pin});save();applyTheme();toast('Données restaurées');R()}catch(e){toast('Sauvegarde invalide')}}

const NV=[['home','🏠','Accueil'],['tx','📋','Transactions'],['add','+','Ajouter'],['st','📊','Statistiques'],['set','⚙️','Paramètres']];
function R(){
 $('#app').innerHTML=({home:vHome,tx:vTx,add:vAdd,st:vSt,set:vSet})[tab]();
 $('#nav').innerHTML=NV.map(([k,i,t])=>k=='add'?`<button class="p ${tab==k?'a':''}" onclick="qa('out')"><b>${i}</b>${t}</button>`:`<button class="${tab==k?'a':''}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join('')}
function lk(){const l=$('#lock');if(!S.pin){l.style.display='none';return}l.style.display='flex';l.innerHTML='<div class="c" style="width:280px;text-align:center"><h1>🔒 Mon Portefeuille</h1><input id="pi" type="password" inputmode="numeric" placeholder="Code PIN" style="text-align:center"><button class="b" onclick="ul()">Ouvrir</button></div>'}
function ul(){if(hs($('#pi').value)==S.pin)$('#lock').style.display='none';else{toast('Code incorrect');$('#pi').value=''}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pin)lk()});
if(!S.tv){S.theme='dark';S.tv=1;save(1)}
applyTheme();R();lk();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body></html>
